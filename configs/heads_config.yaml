# ============================================
# Output Heads Configuration
# ============================================

heads:
  waypoint:
    enabled: true
    hidden_dim: 512
    num_future_steps: 12       # Predict 12 future waypoints (6 seconds at 2 Hz)
    coordinate_dim: 2          # (x, y) per waypoint
    loss: "smooth_l1"          # L1, smooth_l1, or mse

  hazard:
    enabled: true
    hidden_dim: 256
    num_classes: 8             # car, pedestrian, cyclist, truck, barrier, cone, debris, none
    loss: "focal"              # focal loss for class imbalance
    focal_gamma: 2.0

  regulation:
    enabled: true
    hidden_dim: 256
    num_classes: 15            # stop, yield, speed_limit_*, no_entry, one_way, etc.
    loss: "cross_entropy"
    label_smoothing: 0.1

  weather:
    enabled: true
    hidden_dim: 128
    num_classes: 6             # clear, rainy, foggy, snowy, overcast, night
    loss: "cross_entropy"

  # Integration layer fuses all 4 head outputs
  integration:
    fusion_method: "attention"  # "concat", "attention", or "gated"
    fusion_dim: 512
    dropout: 0.1
