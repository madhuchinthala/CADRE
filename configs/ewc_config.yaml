# ============================================
# EWC (Elastic Weight Consolidation) Config
# ============================================

ewc:
  # Lambda controls how strongly we penalize changes to important weights
  # Higher = more protection against forgetting, but less plasticity
  lambda_ewc: 5000.0

  # Number of samples to use for Fisher Information computation
  # (each sample = 1 forward pass through the 7B model, ~30s on RTX 4000)
  fisher_n_samples: 200

  # Whether to normalize Fisher values
  fisher_normalize: true

  # EWC variant: "ewc" (standard) or "online_ewc" (running average)
  variant: "online_ewc"

  # For online EWC: decay factor for old Fisher information
  # gamma = 1.0 means full memory, gamma = 0.0 means no memory
  gamma: 0.95

  # Only compute Fisher for LoRA parameters (not frozen backbone)
  lora_only: true
